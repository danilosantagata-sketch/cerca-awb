<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cerca AWB</title>
<style>
body{margin:0;font:18px system-ui;text-align:center;background:#222;color:#fff;transition:background .15s}
body.ok{background:#1a9c3c}body.no{background:#b3261e}
input{font:22px monospace;width:90%;max-width:500px;padding:10px;margin:8px;text-align:center}
#st{position:relative;width:100%;max-width:500px;aspect-ratio:4/3;margin:0 auto;overflow:hidden;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#fa{position:absolute;left:7.5%;right:7.5%;top:30%;bottom:30%;outline:2px solid #fff;box-shadow:0 0 0 100vmax #0009;pointer-events:none}
#fa::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:1px;background:#fffa}
#esito{font-size:40px;font-weight:700;margin:12px;min-height:56px;word-break:break-all}
button{font:20px system-ui;padding:12px 24px;margin:6px}
</style></head><body>
<p>AWB da trovare</p>
<input id="target" value="JDV031153966297" autocapitalize="characters">
<div id="st"><video id="v" playsinline muted></video><div id="fa"></div></div>
<button id="go">Avvia lettura</button><button id="tc" hidden>Torcia</button>
<div id="esito">—</div>
<p id="n">Scansionate: 0</p>
<script src="bd.js"></script>
<script>
const $=i=>document.getElementById(i), norm=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,"");
let n=0,last="",lastT=0,det,track,torch=false;
try{$("target").value=localStorage.awb||$("target").value}catch(_){}
$("target").onchange=()=>{try{localStorage.awb=$("target").value}catch(_){}};
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.start();o.stop(c.currentTime+.4)}catch(_){}
  navigator.vibrate&&navigator.vibrate(300)}
// stessa zona che si vede nel mirino (+tolleranza), in coordinate del video (object-fit:cover)
function zona(v){
  const W=v.videoWidth,H=v.videoHeight,s=$("st").getBoundingClientRect(),f=$("fa").getBoundingClientRect();
  const k=Math.max(s.width/W,s.height/H),ox=(W*k-s.width)/2,oy=(H*k-s.height)/2,mx=f.width*.075,my=f.height*.15;
  const x0=Math.max(0,(f.left-s.left-mx+ox)/k),x1=Math.min(W,(f.right-s.left+mx+ox)/k);
  const y0=Math.max(0,(f.top-s.top-my+oy)/k),y1=Math.min(H,(f.bottom-s.top+my+oy)/k);
  return [x0,y0,x1-x0,y1-y0].map(Math.round);
}
$("tc").onclick=async()=>{torch=!torch;try{await track.applyConstraints({advanced:[{torch}]})}catch(_){}};
$("go").onclick=async()=>{
  $("go").hidden=true;
  try{
    await BarcodeDetectionAPI.prepareZXingModule({overrides:{locateFile:(p,pre)=>p.endsWith(".wasm")?"zxing_reader.wasm":pre+p},fireImmediately:true});
    det=new BarcodeDetectionAPI.BarcodeDetector({formats:["code_128","code_39","itf","ean_13","qr_code"]});
    const st=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}});
    track=st.getVideoTracks()[0];
    const caps=(track.getCapabilities&&track.getCapabilities())||{},adv=[];
    // gli iPhone Pro non mettono a fuoco da vicino: con zoom 2 si legge a ~25 cm
    if(caps.zoom)adv.push({zoom:Math.min(caps.zoom.max,Math.max(caps.zoom.min,2))});
    if(caps.focusMode&&caps.focusMode.includes("continuous"))adv.push({focusMode:"continuous"});
    if(adv.length)try{await track.applyConstraints({advanced:adv})}catch(_){}
    $("tc").hidden=!caps.torch;
    const v=$("v");v.srcObject=st;await v.play();
    const c=document.createElement("canvas"),cx=c.getContext("2d",{willReadFrequently:true});
    const tick=async()=>{
      if(v.videoWidth){
        const[sx,sy,sw,sh]=zona(v),k=Math.min(1,1280/sw);
        c.width=Math.round(sw*k);c.height=Math.round(sh*k);
        cx.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
        try{for(const b of await det.detect(c)){
          const t=norm(b.rawValue),now=Date.now();
          if(t===last&&now-lastT<1500){lastT=now;continue}
          last=t;lastT=now;n++;$("n").textContent="Scansionate: "+n;
          const ok=t.includes(norm($("target").value));
          document.body.className=ok?"ok":"no";
          $("esito").textContent=ok?"\u2714 TROVATA!":"\u2718 no ("+t+")";
          if(ok)beep();
        }}catch(_){}
      }
      setTimeout(tick,60);
    };
    tick();
  }catch(e){$("esito").textContent="Errore: "+(e.name==="NotAllowedError"?"permesso fotocamera negato (Impostazioni > Safari > Fotocamera)":e.message);$("go").hidden=false}
};
</script></body></html>
